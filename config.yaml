# Configuration for Stock Price Prediction
ticker: "AAPL"
start_date: "2018-01-01"
end_date: "2024-01-01"
lookback_days: 60       # Number of past days used to predict the next day price
train_split: 0.8        # 80% data for training, 20% for testing
model_type: "xgboost"   # Options: "xgboost", "random_forest", "linear"
